name: Publish Docker Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-pg17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push PG17 (latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-17
          push: true
          tags: ghcr.io/${{ env.REPO }}:latest

  build-pg15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push PG15
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-15
          push: true
          tags: ghcr.io/${{ env.REPO }}:15.8.1.086
